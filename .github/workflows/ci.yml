name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (biome)
        run: npm run lint

      - name: Test
        run: npm test

      - name: Install Chromium
        run: npx playwright install --with-deps --no-shell chromium

      - name: Build and E2E tests
        run: npm run test:e2e

      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics
          path: |
            out/e2e/run-*/**/*.png
            out/e2e/run-*/**/trace.zip
            out/e2e/run-*/**/diagnostics.json
          if-no-files-found: ignore
          retention-days: 7
